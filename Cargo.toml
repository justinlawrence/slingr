[package]
name = "sling"
version = "0.1.0"
edition = "2021"
description = "Throw a window at a task. A workspace picker for AeroSpace."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[lib]
name = "sling"
path = "src/lib.rs"

[[bin]]
name = "sling"
path = "src/main.rs"

[profile.release]
opt-level = 2
